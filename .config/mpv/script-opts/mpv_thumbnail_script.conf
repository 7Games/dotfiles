cache_directory=/tmp/mpv_thumbnails

autogenerate=yes
autogenerate_max_duration=7200

prefer_mpv=yes
mpv_no_sub=yes

disable_keybinds=yes

thumbnail_width=200
thumbnail_height=200

thumbnail_count=150

min_delta=5
max_delta=90

thumbnail_network=no
remote_thumbnail_count=60
remote_min_delta=15
remote_max_delta=120
